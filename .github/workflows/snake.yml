name: snake

# Regenerates the animated contribution-grid snake SVG every day and on demand.
# The generated files land in assets/ and are embedded in the README.
on:
  schedule:
    - cron: "0 0 * * 0" # on Sunday's at 00:00 UTC
  workflow_dispatch: # also allows a manual "Run workflow" from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg
            assets/snake-dark.svg?palette=github-dark

      - name: Commit generated snake
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate contribution snake"
          file_pattern: assets/snake*.svg
